<div class="container pt-3 mt-5">
  <div class="row d-flex align-items-center justify-content-center w-100">
    <!-- Image Section -->
    <div class="col-md-6 text-center mb-4 mb-md-0">
      <img [src]="notFoundLogo" alt="Not Found" class="img-fluid" style="max-height: 400px; object-fit: contain;">
    </div>

    <!-- Text Section -->
    <div class="col-md-6 text-center">
      <h2 class="text-danger display-3 mb-3">404 - Page Not Found</h2>
      <p class="text-muted fs-5 mb-4">The page you are looking for does not exist or may have been moved.</p>
      <button class="btn btn-primary btn-lg" (click)="goBack()">Go Back</button>
    </div>
  </div>
</div>
