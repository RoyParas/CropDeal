<div class="container d-flex justify-content-center align-items-center my-5">
  <div class="card shadow w-100" style="max-width: 500px;">
    <div class="card-body p-4">
      <h4 class="card-title text-center mb-4">Change Password</h4>

      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
        <!-- Old Password -->
        <div class="mb-3">
          <label for="oldPassword" class="form-label">Old Password</label>
          <input
            id="oldPassword"
            type="password"
            formControlName="oldPassword"
            class="form-control"
          />
          <div *ngIf="changePasswordForm.get('oldPassword')?.invalid && changePasswordForm.get('oldPassword')?.touched" class="text-danger">
            Enter the old password
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input
            id="newPassword"
            type="password"
            formControlName="newPassword"
            class="form-control"
          />
          <div *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched" class="text-danger">
            <div *ngIf="changePasswordForm.get('newPassword')?.errors?.['required']">Enter the new password</div>
            <div *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters long</div>
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="mb-3">
          <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
          <input
            id="confirmNewPassword"
            type="password"
            formControlName="confirmNewPassword"
            class="form-control"
          />
          <div *ngIf="changePasswordForm.get('confirmNewPassword')?.touched" class="text-danger">
            <div *ngIf="changePasswordForm.get('confirmNewPassword')?.errors?.['required']">
              Re-enter the new password
            </div>
            <div *ngIf="!changePasswordForm.get('confirmNewPassword')?.errors?.['required'] && !isBothPasswordsMatched()">
              Both Passwords do not match
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-danger" [disabled]="loading || changePasswordForm.invalid || !isBothPasswordsMatched()">
            <span *ngIf="loading" class="spinner-border spinner-border-sm text-light" role="status"></span>
            {{ loading ? 'Changing...' : 'Change Password' }}
          </button>
        </div>

        <!-- Feedback Messages -->
        <div *ngIf="errorMessage" class="mt-3 text-center text-danger">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="alert alert-success mt-3 text-center">
          {{ successMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
