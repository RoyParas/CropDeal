<div *ngIf="!isFormVisible" class="d-flex justify-content-end mt-4">
  <button class="btn btn-primary px-5" (click)="showForm()"><i class="fas fa-plus me-2"></i> Add Crop</button>
</div>

<div *ngIf="error && isFormVisible" class="alert alert-danger mt-4" role="alert">{{ error }}</div>

<!-- Add Crop Form -->
<form *ngIf="isFormVisible" (ngSubmit)="addCrop()" class="mt-4 d-flex flex-column row-gap-2 flex-lg-row align-items-stretch align-items-lg-center justify-content-lg-between">
  <div class="form-group d-flex justify-content-between">
    <label for="name" class="col-form-label me-lg-2">Name:</label>
    <input type="text" id="name" name="name" class="form-control" style="width: 300px;" required [(ngModel)]="name"/>
  </div>

  <div class="form-group d-flex justify-content-between">
    <label for="type" class="col-form-label me-lg-2">Type:</label>
    <select id="type" name="type" class="form-control" style="width: 300px;" required [(ngModel)]="type">
      <option>Select Crop Type</option>
      <option value="Vegetable">Vegetable</option>
      <option value="Fruit">Fruit</option>
      <option value="Grain">Grain</option>
    </select>
  </div>

  <!-- Submit Button -->
  <div class="text-center">
    <button type="submit" class="btn btn-outline-success mx-2">Add</button>
    <button class="btn btn-outline-danger mx-2" (click)="closeForm()">Cancel</button>
  </div>
</form>
