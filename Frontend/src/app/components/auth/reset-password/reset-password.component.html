<div class="container d-flex justify-content-center align-items-center mt-5">
  <div *ngIf="verifyingLinkError" class="alert alert-danger text-center w-100" style="max-width: 500px;">
    {{ verifyingLinkError }}
  </div>

  <div *ngIf="!verifyingLinkError" class="card shadow-lg p-5 w-100 bg-white border-0 rounded-4" style="max-width: 420px;">
    <h3 class="text-center text-success">🔑 Reset Your Password</h3>

    <!-- Reset Password Form -->
    <form (ngSubmit)="resetPassword()" *ngIf="!isSuccess" novalidate>
      <!-- New Password -->
      <div class="mb-3">
        <label for="newPassword" class="form-label fw-semibold">New Password</label>
        <input
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          id="newPassword"
          class="form-control"
          placeholder="Enter new password"
          required
          minlength="6"
        />
        <div *ngIf="newPassword && newPassword.length < 6" class="text-danger small mt-1">
          Password must be at least 6 characters long.
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          id="confirmPassword"
          class="form-control"
          placeholder="Confirm new password"
          required
        />
        <div *ngIf="confirmPassword && confirmPassword !== newPassword" class="text-danger small mt-1">
          Passwords do not match.
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button
          class="btn btn-success btn-lg w-100"
          type="submit"
          [disabled]="isLoading || !isFormValid()"
        >
          <ng-container *ngIf="!isLoading">Reset Password</ng-container>
          <ng-container *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span class="ms-2">Processing...</span>
          </ng-container>
        </button>
      </div>
    </form>

    <!-- Success Message -->
    <div *ngIf="isSuccess" class="alert alert-success text-center mt-3">
      {{ message }}
    </div>

    <!-- General Error Message -->
    <div *ngIf="message && !isSuccess" class="alert alert-danger text-center mt-3">
      {{ message }}
    </div>
  </div>
</div>
