<div class="container d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-5 w-100 bg-light border-0 rounded-4" style="max-width: 420px;">
    <h2 class="text-center mb-4 text-success">Reset Password</h2>
    <form [formGroup]="form" (ngSubmit)="requestReset()">
      <div>
        <label for="email" class="form-label fw-semibold">Enter your registered Email</label>
        <input
          type="email"
          formControlName="email"
          class="form-control form-control-lg"
          placeholder="you@example.com"
        />
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-danger">
          Please enter a valid email address.
        </div>
      </div>

      <div *ngIf="errorMessage">
        <div class="text-danger">{{ errorMessage }}</div>
      </div>

      <button
        class="btn btn-success btn-lg mt-3 w-100"
        type="submit"
        [disabled]="isLoading || form.invalid"
      >
        <ng-container *ngIf="!isLoading">📩 Send Reset Link</ng-container>
        <ng-container *ngIf="isLoading">
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span class="ms-2">Sending...</span>
        </ng-container>
      </button>
    </form>

    <div class="alert alert-success mt-4" *ngIf="successMessage">
      {{successMessage}}
    </div>
  </div>
</div>
