<div class="container mt-4 w-full">
  <div class="d-flex align-items-center justify-content-evenly">
    <!-- Form Column -->
    <div class="col-lg-4 col-md-7 col-9">
      <div class="card px-4 shadow-lg rounded-lg">
        <div class="text-center mb-2">
            <img [src]="logo" alt="App Logo" style="width: 95px;">
            <h5 class="text-center medium">Login to your account</h5>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="px-1">
            <!-- Email Input -->
            <div class="mb-2">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                formControlName="email"
                class="form-control"
                placeholder="Enter your email"
                required
              />
            </div>

            <!-- Password Input -->
            <div class="mb-2">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                formControlName="password"
                class="form-control"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <!-- Error Message -->
          <p *ngIf="errorMessage" class="text-danger text-center">{{ errorMessage }}</p>

          <!-- Spinner and Submit Button -->
          <div class="d-flex flex-column justify-content-center">
            <a routerLink="/forget-password" class="mb-2 text-end text-success small text-decoration-none fw-medium">Forget Password ?</a>
            <button
              type="submit"
              class="btn btn-success rounded-5 mb-2"
              [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              {{ isLoading ? 'Logging in...' : 'Login' }}
            </button>
            <p class="text-center small">Don't have an account? <a routerLink="/signup" class="text-primary text-decoration-none fw-medium">Register</a></p>
          </div>
        </form>
      </div>
    </div>

    <!-- Image Column -->
    <div class="col-5 d-none d-lg-block">
      <img [src]="loginImg"
        alt="Login image" class="w-100 h-100" style="object-fit:cover;">
    </div>
  </div>
</div>
