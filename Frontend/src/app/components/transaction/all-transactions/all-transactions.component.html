<div class="container my-5">
  <div *ngIf="loading" class="d-flex justify-content-center align-items-center" style="height: 200px;">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <h4 *ngIf="!loading" class="mb-4 text-center">{{transactions.length != 0 ? 'All Transactions' : 'No transactions have been made'}}</h4>
  <div *ngIf="!loading && transactions.length != 0">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <div class="col" *ngFor="let transaction of transactions">
        <div class="card h-100 border-1 shadow rounded-4">
          <div class="card-body p-3">
            <div>
              <p class="mb-0 fw-semibold small">Transaction ID : <span class="fw-medium text-muted">{{ transaction.id | shortenId }}</span></p>
              <p class="mb-0 fw-semibold small">Listing ID: <span class="mb-0 fw-medium text-muted">{{ transaction.listingId | shortenId}}</span></p>
            </div>
            

            <!-- Total Price and Status -->
            <div class="d-flex justify-content-between align-items-center my-2">
              <p class="mb-0 text-muted small fs-6 fw-semibold">Total Price: <span class="fw-bold text-primary">₹{{ transaction.totalPrice }}</span></p>
              <span class="badge rounded-pill px-2 py-1"
                [ngClass]="{
                  'bg-info': transaction.transactionStatus === 'Pending',
                  'bg-danger': transaction.transactionStatus === 'Rejected',
                  'bg-warning': transaction.transactionStatus === 'Accepted',
                  'bg-success':transaction.transactionStatus === 'Completed'
                }">
                {{ transaction.transactionStatus }}
              </span>
            </div>
          </div>

          <!-- Buttons -->
          <div class="card-footer d-flex justify-content-around flex-wrap-reverse gap-2">
            <button *ngIf="getRole() === 'Farmer' && transaction.transactionStatus === 'Pending'"
                    class="btn btn-outline-success btn-sm rounded-3"
                    (click)="acceptTransaction(transaction.id)">
              <i class="fas fa-check-circle me-1"></i> Accept
            </button>
            <button *ngIf="(getRole() === 'Farmer' && transaction.transactionStatus === 'Pending') ||
                    (getRole() === 'Dealer' && transaction.transactionStatus === 'Accepted')"
                    class="btn btn-outline-danger btn-sm rounded-3"
                    (click)="rejectTransaction(transaction.id)">
              <i class="fas fa-times-circle me-1"></i> Reject
            </button>
            <button class="btn btn-outline-primary btn-sm rounded-3"
                    (click)="viewTransaction(transaction.id)">
              View Details
              <span *ngIf="getRole() === 'Dealer' && transaction.transactionStatus === 'Accepted'"> & Make Payment</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
